spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

logging:
  level:
    # Set to DEBUG to also see read queries and no-op status changes
    com.tradeBytes.toDoLIstService: INFO

todo:
  past-due-check:
    # How often to flag overdue "not done" items as "past due"
    interval: 60s
